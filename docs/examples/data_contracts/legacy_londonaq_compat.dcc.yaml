contract:
  kind: imputebench.data-construction-contract
  schema_version: 1.0.0
  title: Legacy LondonAQ compatibility contract (actual current source)

dataset:
  name: London AQ Synthetic (legacy dat-tsv)
  slug: london_aq_synthetic_legacy
  version: legacy-1.0.0
  description: >-
    Auto-generated compatibility contract for the CURRENT legacy LondonAQ
    dat-tsv source. Canonical shape is the actual (600, 10, 14, 4) snapshot
    with pollutants NO, NO2, O3, SO2 — NOT the illustrative annual
    (8760, 14, 10, 5) NetCDF example.
  nature: synthetic
  tags: [london, air-quality, synthetic, legacy]
  immutable_snapshot: true

source:
  format: legacy_dat_tsv
  path: datasets/london_aq_synthetic
  adapter: builtin.legacy_dat_tsv.v1
  import_mode: reference
  source_axis_order: [time, grid_row, grid_col, variable]
  legacy:
    file_pattern: "{source_label}.dat"
    delimiter: "\t"
    header: false
    flattened_time_rows: 6000
    grid_cols_in_file: 14
    variable_files:
      "NO": NO.dat
      "NO2": NO2.dat
      "O3": O3.dat
      "SO2": SO2.dat
    drop_empty_columns: true

tensor:
  canonical_axis_order: [time, grid_row, grid_col, variable]
  shape: [600, 10, 14, 4]
  canonical_dtype: float64
  allow_axis_reorder: true
  allow_safe_dtype_cast: true
  memory_order: C
  canonical_missing_value: NaN

dimensions:
  time:
    source_name: time
    source_index: 0
    size: 600
    semantic_type: temporal
    coordinate:
      encoding: index
      monotonicity: strictly_increasing
      regularity: regular
  grid_row:
    source_name: grid_row
    source_index: 1
    size: 10
    semantic_type: spatial_row
    coordinate:
      encoding: index
      minimum: 0
      maximum: 9
      coordinate_system: grid_index
  grid_col:
    source_name: grid_col
    source_index: 2
    size: 14
    semantic_type: spatial_col
    coordinate:
      encoding: index
      minimum: 0
      maximum: 13
      coordinate_system: grid_index
  variable:
    source_name: variable
    source_index: 3
    size: 4
    semantic_type: measured_variable
    coordinate:
      encoding: labels
      labels: ["NO", "NO2", "O3", "SO2"]
      case_sensitive: true

variables:
  - id: "no"
    source_label: "NO"
    unit: unknown
    valid_range: {minimum: 0.0, maximum: null, inclusive_minimum: true}
  - id: no2
    source_label: NO2
    unit: unknown
    valid_range: {minimum: 0.0, maximum: null, inclusive_minimum: true}
  - id: o3
    source_label: O3
    unit: unknown
    valid_range: {minimum: 0.0, maximum: null, inclusive_minimum: true}
  - id: so2
    source_label: SO2
    unit: unknown
    valid_range: {minimum: 0.0, maximum: null, inclusive_minimum: true}

missing_data:
  representations: [nan]
  sentinels: []
  canonical_representation: nan
  reject_infinity: true
  allow_missing: true
  maximum_fraction_global: 1.0

station_selection:
  methods: [grid_coordinates]
  default_method: grid_coordinates
  grid_coordinates:
    row_parameter: row
    col_parameter: col
    row_bounds: [0, 9]
    col_bounds: [0, 13]
  active_cell_policy: all

provenance:
  source_name: London AQ Synthetic
  publisher: EviBench
  generation_method: Synthetic London air-quality grid (supervisor dataset, thesis v0.2).
  license: unspecified
  processing_history: []
  contact: {}

validation:
  mode: strict
  full_scan: true
  reject_unknown_fields: true
  reject_out_of_range: true
  station_index_required: false

lane_defaults:
  lane1:
    view_policy: station_required
    preserve_rank: true
    output_shape: [time, 1, 1, variable]
  lane2:
    view_policy: full_grid

extensions: {}
